name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fronten_miracles/package-lock.json

      - name: Install dependencies
        run: cd fronten_miracles && npm install

      - name: Build
        run: cd fronten_miracles && npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://miracles-strapi.onrender.com
          NEXT_PUBLIC_STRAPI_URL: https://miracles-strapi.onrender.com
          NEXT_PUBLIC_SITE_URL: https://miracles-frontend.pages.dev

      - name: Create Pages project if needed
        run: npx wrangler pages project create miracles-frontend --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy fronten_miracles/out --project-name miracles-frontend --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353
