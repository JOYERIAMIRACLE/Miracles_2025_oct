name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # El backend lo dispara al publicar productos, categorías o posts (ver
  # apps/backend/src/rebuild-tienda.js).
  repository_dispatch:
    types: [strapi-publish]

# Un solo deploy a la vez; si llegan varios, GitHub conserva solo el más reciente en espera.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy-personal:
    name: Deploy apps/personal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Esperar al backend
        run: node scripts/verify-build.mjs esperar
        env:
          NEXT_PUBLIC_BACKEND_URL: https://miracles2025oct-production.up.railway.app

      - name: Build personal
        run: pnpm --filter @miracles/personal build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://miracles2025oct-production.up.railway.app
          NEXT_PUBLIC_STRAPI_URL: https://miracles2025oct-production.up.railway.app
          NEXT_PUBLIC_SITE_URL: https://medalladeoro.com.mx
          NEXT_PUBLIC_CAMPANA_TOKEN: ${{ secrets.NEXT_PUBLIC_CAMPANA_TOKEN }}

      - name: Verificar que el build trae todas las páginas
        run: node scripts/verify-build.mjs verificar
        env:
          NEXT_PUBLIC_BACKEND_URL: https://miracles2025oct-production.up.railway.app

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/personal/out --project-name richard-avrod --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353

      - name: Prepare campana deploy
        run: |
          cp -r apps/personal/out apps/campana-out
          printf '<html><head><meta http-equiv="refresh" content="0;url=/campana-110"><script>location.href="/campana-110"</script></head></html>' > apps/campana-out/index.html

      - name: Create campana Pages project (if not exists)
        run: npx wrangler pages project create sdi-campana --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353

      - name: Deploy campana to Cloudflare Pages
        run: npx wrangler pages deploy apps/campana-out --project-name sdi-campana --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353

      - name: Prepare soportedinamico deploy
        run: |
          cp -r apps/personal/out apps/sdi-out
          printf '<html><head><meta http-equiv="refresh" content="0;url=/soportedinamico"><script>location.replace("/soportedinamico")</script></head></html>' > apps/sdi-out/index.html

      - name: Create soportedinamico Pages project (if not exists)
        run: npx wrangler pages project create soportedinamico --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353

      - name: Deploy soportedinamico to Cloudflare Pages
        run: npx wrangler pages deploy apps/sdi-out --project-name soportedinamico --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0a6ff7def6c2a2db4c33869b490353
